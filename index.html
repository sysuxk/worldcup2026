var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;

        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

        maxEcCount = Math.max(maxEcCount, ecCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;

        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';

      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +

          escapeXml(alt.text) + '</description>' : '';

    function getClientId(){let id=localStorage.getItem(CLIENT_KEY);if(!id){id=newId();localStorage.setItem(CLIENT_KEY,id)}return id}

    function groupValid(i){const p=state.groupPicks[GROUPS[i].id];const v=RANK_KEYS.map(k=>p[k]).filter(Boolean);return v.length===4&&new Set(v).size===4}
    function allGroupsComplete(){return GROUPS.every((_,i)=>groupValid(i))}
    function groupRank(groupId,teamId){const p=state.groupPicks[groupId];const idx=RANK_KEYS.findIndex(k=>p[k]===teamId);return idx>=0?idx+1:0}
    function clickGroupTeam(groupId,teamId){const p=state.groupPicks[groupId];const existing=RANK_KEYS.find(k=>p[k]===teamId);if(existing)p[existing]='';else{const empty=RANK_KEYS.find(k=>!p[k]);if(empty)p[empty]=teamId}}
    function nextIncompleteGroup(from=0){for(let off=1;off<=GROUPS.length;off++){const i=(from+off)%GROUPS.length;if(!groupValid(i))return i}return -1}
    function selectedThirdTeams(){return allGroupsComplete()?GROUPS.map(g=>state.groupPicks[g.id].third):[]}
    function getQualifiers(){if(!allGroupsComplete()||state.bestThirds.length!==8)return[];const q=[];GROUPS.forEach(g=>{q.push({teamId:state.groupPicks[g.id].first,group:g.id,rank:1});q.push({teamId:state.groupPicks[g.id].second,group:g.id,rank:2})});state.bestThirds.forEach(id=>q.push({teamId:id,group:getTeamGroup(id),rank:3}));return q}
    function clearKnockout(){state.rounds={r32:{},r16:{},qf:{},sf:{},final:{}};state.champion='';state.recordedChampion='';state.remoteRecordedChampion='';remoteStats=null;posterBlob=null;posterDataUrl=''}
    function clearFromRound(round){const start=ROUND_ORDER.indexOf(round);ROUND_ORDER.slice(start).forEach(r=>state.rounds[r]={});state.champion='';state.recordedChampion='';state.remoteRecordedChampion='';remoteStats=null;posterBlob=null;posterDataUrl=''}

    function buildR32Matches(){const q=getQualifiers();if(q.length!==32)return[];const winners=q.filter(x=>x.rank===1);const others=q.filter(x=>x.rank!==1).sort((a,b)=>b.rank-a.rank||a.group.localeCompare(b.group));const pool=[...others],matches=[];winners.forEach((w,i)=>{let oi=pool.findIndex(x=>x.group!==w.group);if(oi<0)oi=0;const [o]=pool.splice(oi,1);matches.push({id:`r32-${i+1}`,teams:[w.teamId,o.teamId]})});while(pool.length){const a=pool.shift();let bi=pool.findIndex(x=>x.group!==a.group);const [b]=pool.splice(bi>=0?bi:0,1);matches.push({id:`r32-${matches.length+1}`,teams:[a.teamId,b.teamId]})}return matches.slice(0,16)}
    function getRoundMatches(round){if(round==='r32')return buildR32Matches();const prev=ROUND_ORDER[ROUND_ORDER.indexOf(round)-1];const prevMatches=getRoundMatches(prev);const winners=prevMatches.map(m=>state.rounds[prev][m.id]).filter(Boolean);const need={r16:16,qf:8,sf:4,final:2}[round];if(winners.length!==need)return[];const matches=[];for(let i=0;i<winners.length;i+=2)matches.push({id:`${round}-${i/2+1}`,teams:[winners[i],winners[i+1]]});return matches}
    function roundComplete(round){const m=getRoundMatches(round);return m.length>0&&m.every(x=>state.rounds[round][x.id])}
    function firstIncompleteMatch(round){const m=getRoundMatches(round);const i=m.findIndex(x=>!state.rounds[round][x.id]);return i>=0?i:0}
    function advanceAfterWinner(round){if(round==='final'&&roundComplete('final')){state.champion=state.rounds.final['final-1'];state.currentStep='poster';handleChampionComplete();return}if(roundComplete(round)){const next=ROUND_ORDER[ROUND_ORDER.indexOf(round)+1];state.currentRound=next;state.currentMatchIndex=0}else{state.currentRound=round;state.currentMatchIndex=firstIncompleteMatch(round)}}

    async function submitChampionToDatabase(){if(!DB_ENABLED||!state.champion||state.remoteRecordedChampion===state.champion)return false;const body={client_id:state.clientId,session_id:state.sessionId,champion:state.champion,bracket:{groupPicks:state.groupPicks,bestThirds:state.bestThirds,rounds:state.rounds}};try{const res=await fetch(`${SUPABASE_URL}/rest/v1/champion_predictions`,{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(body)});if(!res.ok&&res.status!==409)throw new Error(await res.text());state.remoteRecordedChampion=state.champion;saveState();return true}catch(e){console.warn('Supabase insert failed',e);return false}}
    async function fetchChampionStats(teamId){if(!DB_ENABLED)return null;try{const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_champion_stats`,{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},body:JSON.stringify({champion_id:teamId})});if(!res.ok)throw new Error(await res.text());const data=await res.json();const row=Array.isArray(data)?data[0]:data;return{scope:'全站',champion:teamId,total:Number(row.total||0),count:Number(row.count||0),percent:Number(row.percent||0)}}catch(e){console.warn('Supabase stats failed',e);return null}}
    async function handleChampionComplete(){localRecord();remoteStats={scope:'全站',champion:state.champion,total:0,count:0,percent:0,loading:true};renderAll();await submitChampionToDatabase();const s=await fetchChampionStats(state.champion);if(s){remoteStats=s}else{remoteStats={scope:'全站',champion:state.champion,total:0,count:0,percent:0,pending:true}}renderAll();saveState()}

    function setStep(step){state.currentStep=step;renderAll()}
    function completedCount(){const gd=GROUPS.reduce((s,_,i)=>s+RANK_KEYS.filter(k=>state.groupPicks[GROUPS[i].id][k]).length,0);const td=state.bestThirds.length;const kd=ROUND_ORDER.reduce((s,r)=>s+Object.keys(state.rounds[r]).length,0);return gd+td+kd}
    function renderShell(){const idx=STEPS.indexOf(state.currentStep);$('#topStep').textContent=STEP_LABELS[state.currentStep];const topReset=$('#topReset');if(topReset){topReset.onclick=resetAll;topReset.classList.toggle('hidden',state.currentStep==='intro'&&completedCount()===0);}$('#stepDots').innerHTML=STEPS.map((s,i)=>`<span class="dot ${i<=idx?'active':''}"></span>`).join('');$('#progressFill').style.width=`${Math.min(100,Math.round(completedCount()*100/87))}%`;STEPS.forEach(s=>$(`#${s}Panel`)?.classList.toggle('hidden',state.currentStep!==s))}
    function renderIntro(){ $('#toolbar').className='h5-toolbar single'; $('#toolbar').innerHTML='<button class="primary" id="startBtn">开始预测</button>'; $('#startBtn').onclick=()=>{state.currentStep='groups';renderAll()} }
    function renderGroups(){const i=Math.min(state.currentGroupIndex,GROUPS.length-1);const g=GROUPS[i],p=state.groupPicks[g.id];const done=GROUPS.filter((_,idx)=>groupValid(idx)).length;$('#groupWizard').innerHTML=`<span class="badge">第 ${i+1}/12 组</span><h2>${g.id}组排名</h2><p>按你预测的名次依次点击：第1名 → 第2名 → 第3名 → 第4名。点错可再点取消。</p><div class="stack">${g.teams.map(t=>{const r=groupRank(g.id,t.id);return`<button class="team-card ${r?'ranked':''}" data-group="${g.id}" data-team="${t.id}"><span class="rank ${r?'on':''}">${r?RANK_LABELS[r-1]:'点'}</span><span class="flag">${t.flag}</span><span><span class="name">${t.nameZh}</span><span class="en">${t.nameEn}</span></span></button>`}).join('')}</div><p class="muted">已完成 ${done}/12 组${allGroupsComplete()?'，可以进入最佳第三。':''}</p>`;$('#toolbar').className='h5-toolbar';$('#toolbar').innerHTML=allGroupsComplete()?'<button class="ghost" id="prevGroup">上一组</button><button class="primary" id="goThirds">进入最佳第三</button>':'<button class="ghost" id="prevGroup">上一组</button><button class="ghost" id="nextGroup">下一组</button>';$('#prevGroup').onclick=()=>{state.currentGroupIndex=(i+11)%12;renderAll()};const nextGroupBtn=$('#nextGroup');if(nextGroupBtn)nextGroupBtn.onclick=()=>{if(i===GROUPS.length-1&&allGroupsComplete()){state.currentStep='thirds'}else{state.currentGroupIndex=(i+1)%12}renderAll()};const goThirds=$('#goThirds');if(goThirds)goThirds.onclick=()=>{state.currentStep='thirds';renderAll()};document.querySelectorAll('[data-group][data-team]').forEach(b=>b.onclick=()=>{clickGroupTeam(b.dataset.group,b.dataset.team);state.bestThirds=state.bestThirds.filter(id=>selectedThirdTeams().includes(id));clearKnockout();renderAll();if(groupValid(i)){setTimeout(()=>{if(state.currentStep!=='groups'||!groupValid(i))return;const n=nextIncompleteGroup(i);if(n>=0)state.currentGroupIndex=n;else state.currentStep='thirds';renderAll()},450)}})}

    function navHtml(){const items=['<button class="ghost" data-stepnav="groups">小组赛</button>'];if(allGroupsComplete())items.push('<button class="ghost" data-stepnav="thirds">最佳第三</button>');if(getQualifiers().length===32)ROUND_ORDER.forEach(r=>{if(getRoundMatches(r).length)items.push(`<button class="ghost ${state.currentStep==='bracket'&&state.currentRound===r?'selected':''}" data-roundnav="${r}">${ROUND_LABELS[r]}</button>`)});return `<div class="round-nav">${items.join('')}</div>`}

    function bindNav(){document.querySelectorAll('[data-stepnav]').forEach(b=>b.onclick=()=>{state.currentStep=b.dataset.stepnav;renderAll()});document.querySelectorAll('[data-roundnav]').forEach(b=>b.onclick=()=>{state.currentStep='bracket';state.currentRound=b.dataset.roundnav;state.currentMatchIndex=firstIncompleteMatch(state.currentRound);renderAll()})}
    function renderThirds(){const thirds=selectedThirdTeams();$('#thirdWizard').innerHTML=`<span class="badge">最佳小组第三</span><h2>选择 8 支晋级</h2><p>从 12 支小组第三里选 8 支。选满后自动进入 32 强。</p>${navHtml()}<div class="pill-grid">${thirds.map(id=>{const t=getTeam(id),sel=state.bestThirds.includes(id),blocked=!sel&&state.bestThirds.length>=8;return`<button class="third-card ${sel?'selected':''}" ${blocked?'disabled':''} data-third="${id}"><span class="flag">${t.flag}</span><span><span class="third-name">${t.nameZh}${sel?'<span class="selected-mark">已选</span>':''}</span><span class="en">${getTeamGroup(id)}组第3</span></span></button>`}).join('')||'<p>请先完成所有小组。</p>'}</div><p class="muted">已选 ${state.bestThirds.length}/8</p>`;$('#toolbar').className='h5-toolbar';$('#toolbar').innerHTML='<button class="ghost" id="backGroups">返回小组赛</button><button class="primary" id="toBracket" '+(state.bestThirds.length===8?'':'disabled')+'>进入淘汰赛</button>';$('#backGroups').onclick=()=>{state.currentStep='groups';renderAll()};$('#toBracket').onclick=()=>{state.currentStep='bracket';state.currentRound='r32';state.currentMatchIndex=firstIncompleteMatch('r32');renderAll()};document.querySelectorAll('[data-third]').forEach(b=>b.onclick=()=>{const id=b.dataset.third;if(state.bestThirds.includes(id))state.bestThirds=state.bestThirds.filter(x=>x!==id);else if(state.bestThirds.length<8)state.bestThirds.push(id);clearKnockout();if(state.bestThirds.length===8){state.currentStep='bracket';state.currentRound='r32';state.currentMatchIndex=0}renderAll()})}
    function renderBracket(){const matches=getRoundMatches(state.currentRound);if(!matches.length){$('#bracketWizard').innerHTML='<h2>等待上一轮完成</h2><p>请先完成前面的选择。</p>';return}state.currentMatchIndex=Math.min(state.currentMatchIndex,matches.length-1);const m=matches[state.currentMatchIndex];const picked=state.rounds[state.currentRound][m.id];$('#bracketWizard').innerHTML=`<span class="badge">${ROUND_LABELS[state.currentRound]} · ${state.currentMatchIndex+1}/${matches.length}</span><h2>选择本场胜者</h2><p>${roundNotice()}</p>${navHtml()}<div class="match-vs">${m.teams.map((id,idx)=>`<button class="team-card ${picked===id?'selected':''}" data-win="${id}"><span class="rank ${picked===id?'on':''}">${picked===id?'胜':'选'}</span><span class="flag">${getTeam(id).flag}</span><span><span class="name">${getTeam(id).nameZh}</span><span class="en">${getTeam(id).nameEn}</span></span></button>${idx===0?'<div class="vs">VS</div>':''}`).join('')}</div><p class="muted">本轮已完成 ${Object.keys(state.rounds[state.currentRound]).length}/${matches.length}</p>`;$('#toolbar').className='h5-toolbar';$('#toolbar').innerHTML='<button class="ghost" id="prevMatch">上一场</button><button class="ghost" id="nextMatch">下一场</button>';$('#prevMatch').onclick=()=>{state.currentMatchIndex=Math.max(0,state.currentMatchIndex-1);renderAll()};$('#nextMatch').onclick=()=>{state.currentMatchIndex=Math.min(matches.length-1,state.currentMatchIndex+1);renderAll()};document.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>{state.rounds[state.currentRound][m.id]=b.dataset.win;if(state.currentRound==='final')state.champion=b.dataset.win;else clearFromRound(ROUND_ORDER[ROUND_ORDER.indexOf(state.currentRound)+1]);advanceAfterWinner(state.currentRound);renderAll()})}
    function renderPoster(){if(!state.champion){$('#posterWizard').innerHTML='<h2>还没有冠军</h2><p>请先完成淘汰赛。</p>';return}const t=getTeam(state.champion),s=displayStats(state.champion),ps=persona(s.percent);$('#posterWizard').innerHTML=`<div class="champion-card"><div class="champion-flag">${t.flag}</div><div class="champion-name">${t.nameZh}</div><span class="tag">${ps.name}</span><p>${s.loading?'正在保存你的预测，并计算全站百分比...':s.pending?'预测已生成，全站百分比稍后更新。':`<strong>${s.percent}%</strong> 的${s.scope}用户选择了这个冠军（${s.count}/${s.total}）。`}</p><p>${ps.comment}</p></div><h3>写上你的名字</h3><input class="name-input" id="playerName" maxlength="16" placeholder="例如：小坤" value="${state.playerName||''}"><p class="muted">填写后图片会自动更新，名字会放到海报标题下方。</p><div class="tip" style="font-size:22px;font-weight:950;text-align:center;line-height:1.35">长按保存图片<br>分享到朋友圈</div>${posterDataUrl?`<img class="poster-preview" src="${posterDataUrl}" alt="预测海报预览">`:'<p class="tip" id="shareTip">正在生成图片...</p>'}<div class="share-sheet"><button class="ghost" id="copyLink">复制链接</button></div>`;$('#toolbar').className='h5-toolbar';$('#toolbar').innerHTML='<button class="ghost" id="editBracket">修改淘汰赛</button><button class="ghost" id="copyLinkBottom">复制链接</button>';let nameTimer;$('#playerName').oninput=e=>{state.playerName=e.target.value.trim().slice(0,16);posterBlob=null;posterDataUrl='';saveState();clearTimeout(nameTimer);nameTimer=setTimeout(makePosterPreview,350)};$('#editBracket').onclick=()=>{state.currentStep='bracket';state.currentRound='final';state.currentMatchIndex=0;renderAll()};$('#copyLink').onclick=copyLink;$('#copyLinkBottom').onclick=copyLink;if(!posterDataUrl&&!s.loading)setTimeout(makePosterPreview,80)}
    function renderAll(){renderShell();if(state.currentStep==='intro')renderIntro();if(state.currentStep==='groups')renderGroups();if(state.currentStep==='thirds')renderThirds();if(state.currentStep==='bracket')renderBracket();if(state.currentStep==='poster')renderPoster();bindNav();saveState()}

    function drawQr(ctx,text,x,y,size){const qr=qrcode(0,'H');qr.addData(text);qr.make();const n=qr.getModuleCount();const pad=18;const inner=size-pad*2;const cell=inner/n;ctx.fillStyle='#fff';roundRect(ctx,x,y,size,size,28);ctx.fill();ctx.fillStyle='#06101a';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c)){const mx=x+pad+c*cell,my=y+pad+r*cell;roundRect(ctx,mx,my,Math.ceil(cell*.92),Math.ceil(cell*.92),2);ctx.fill()}const logo=size*.32,lx=x+size/2-logo/2,ly=y+size/2-logo/2;ctx.fillStyle='#f4c95d';ctx.beginPath();ctx.arc(x+size/2,y+size/2,logo/2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#06101a';ctx.lineWidth=6;ctx.stroke();ctx.font=`${Math.floor(logo*.5)}px -apple-system,BlinkMacSystemFont,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#06101a';ctx.fillText('🏆',x+size/2,y+size/2+2);ctx.textBaseline='alphabetic'}
    function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
    function slot(ctx,text,x,y,w,h,on=false){ctx.fillStyle=on?'rgba(67,209,122,.28)':'rgba(255,255,255,.07)';roundRect(ctx,x,y,w,h,6);ctx.fill();ctx.strokeStyle=on?'rgba(67,209,122,.75)':'rgba(255,255,255,.18)';ctx.stroke();ctx.fillStyle=on?'#43d17a':'#f7fbff';ctx.font='700 18px -apple-system,BlinkMacSystemFont,sans-serif';ctx.textAlign='center';ctx.fillText(text,x+w/2,y+h-8)}
    function drawCompactBracket(ctx,x,y,w,h){const r32=getRoundMatches('r32'),r16=getRoundMatches('r16'),qf=getRoundMatches('qf'),sf=getRoundMatches('sf'),fin=getRoundMatches('final');ctx.fillStyle='#f4c95d';ctx.font='900 28px -apple-system,BlinkMacSystemFont,sans-serif';ctx.textAlign='center';ctx.fillText('32强淘汰赛预测图',x+w/2,y-18);const col=[x,x+95,x+180,x+260,x+w/2-58,x+w/2+58,x+w-330,x+w-250,x+w-155,x+w-60],sw=58,sh=24;function drawSide(matches,side){const left=side==='L';const base=left?0:8;for(let i=0;i<8;i++){const m=matches[base+i];const yy=y+i*(h/8)+4;slot(ctx,shortTeam(m?.teams[0]),left?col[0]:col[9],yy,sw,sh,state.rounds.r32[m?.id]===m?.teams[0]);slot(ctx,shortTeam(m?.teams[1]),left?col[0]:col[9],yy+26,sw,sh,state.rounds.r32[m?.id]===m?.teams[1])}for(let i=0;i<4;i++){const m=r16[(left?0:4)+i];slot(ctx,shortTeam(state.rounds.r16[m?.id]||m?.teams[0]),left?col[1]:col[8],y+i*(h/4)+28,sw,sh,!!state.rounds.r16[m?.id])}for(let i=0;i<2;i++){const m=qf[(left?0:2)+i];slot(ctx,shortTeam(state.rounds.qf[m?.id]||m?.teams[0]),left?col[2]:col[7],y+i*(h/2)+82,sw,sh,!!state.rounds.qf[m?.id])}const sm=sf[left?0:1];slot(ctx,shortTeam(state.rounds.sf[sm?.id]||sm?.teams[0]),left?col[3]:col[6],y+h/2-12,sw,sh,!!state.rounds.sf[sm?.id])}drawSide(r32,'L');drawSide(r32,'R');slot(ctx,shortTeam(fin[0]?.teams[0]),col[4],y+h/2-40,sw,sh,state.champion===fin[0]?.teams[0]);slot(ctx,shortTeam(fin[0]?.teams[1]),col[5],y+h/2-40,sw,sh,state.champion===fin[0]?.teams[1]);ctx.fillStyle='#f4c95d';ctx.font='900 22px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText('FINAL',x+w/2,y+h/2+12);ctx.fillStyle='#43d17a';ctx.font='900 26px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(shortTeam(state.champion),x+w/2,y+h/2+44)}
    function generatePosterCanvas(){if(!state.champion)return null;const t=getTeam(state.champion),s=displayStats(state.champion),ps=persona(s.percent),canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const ctx=canvas.getContext('2d'),g=ctx.createLinearGradient(0,0,1080,1920);g.addColorStop(0,'#07131f');g.addColorStop(.55,'#10243a');g.addColorStop(1,'#06101a');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);ctx.fillStyle='rgba(67,209,122,.16)';ctx.beginPath();ctx.arc(120,90,260,0,Math.PI*2);ctx.fill();ctx.textAlign='center';ctx.fillStyle='#f4c95d';ctx.font='800 34px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText('2026 WORLD CUP PREDICTION',540,105);ctx.fillStyle='#f7fbff';ctx.font='900 58px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText('我的冠军预测',540,180);if(state.playerName){ctx.fillStyle='#b8c7d9';ctx.font='32px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(`${state.playerName} 的预测`,540,235);ctx.fillStyle='#f7fbff';}ctx.font='110px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(t.flag,540,335);ctx.fillStyle='#43d17a';ctx.font='900 74px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(t.nameZh,540,430);ctx.fillStyle='#f4c95d';ctx.font='900 38px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(s.loading?`${ps.name} · 正在计算全站人气`:s.pending?`${ps.name} · 人气稍后更新`:`${ps.name} · ${s.percent}% ${s.scope}人气`,540,495);ctx.fillStyle='#b8c7d9';ctx.font='30px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText(ps.comment,540,545);drawCompactBracket(ctx,60,650,960,760);ctx.fillStyle='#f4c95d';ctx.font='900 30px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText('长按保存图片 · 分享朋友圈',540,1470);drawQr(ctx,PUBLIC_SITE_URL,380,1500,320);ctx.fillStyle='#f7fbff';ctx.font='900 34px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText('扫码生成你的预测',540,1855);ctx.fillStyle='#8fa4bb';ctx.font='24px -apple-system,BlinkMacSystemFont,sans-serif';ctx.fillText('GitHub Pages · 2026世界杯预测器',540,1895);return canvas}
    function canvasToBlob(canvas){return new Promise(resolve=>canvas.toBlob(resolve,'image/png'))}
    async function makePosterPreview(){const input=$('#playerName');if(input)state.playerName=input.value.trim().slice(0,16);const c=generatePosterCanvas();if(!c)return alert('请先完成冠军预测');posterBlob=await canvasToBlob(c);posterDataUrl=c.toDataURL('image/png');renderAll();setTimeout(()=>document.querySelector('.poster-preview')?.scrollIntoView({behavior:'smooth',block:'start'}),50)}
    async function shareImage(){if(!posterBlob)await makePosterPreview();const file=new File([posterBlob],'world-cup-2026-prediction.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'我的2026世界杯预测',text:'看我的冠军预测图',files:[file]});return}const url=URL.createObjectURL(posterBlob);const a=document.createElement('a');a.href=url;a.download='world-cup-2026-prediction.png';a.click();URL.revokeObjectURL(url);$('#shareTip').textContent='已下载图片。可长按保存，或用微信/系统分享发送。'}
    async function copyLink(){try{await navigator.clipboard.writeText(PUBLIC_SITE_URL);$('#shareTip').textContent='GitHub访问链接已复制。'}catch(e){prompt('复制这个链接：',PUBLIC_SITE_URL)}}
    function resetAll(){if(!confirm('重新填写会清空当前预测，但保留历史统计。确定吗？'))return;state={currentStep:'groups',currentGroupIndex:0,currentRound:'r32',currentMatchIndex:0,groupPicks:emptyGroupPicks(),bestThirds:[],rounds:{r32:{},r16:{},qf:{},sf:{},final:{}},champion:'',recordedChampion:'',remoteRecordedChampion:'',clientId:getClientId(),sessionId:newId(),playerName:''};remoteStats=null;posterBlob=null;posterDataUrl='';renderAll()}
    loadState();renderAll();
  </script>
